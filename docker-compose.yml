name: rf-matrix-audit

services:
  web:
    build: ./web
    image: rf-matrix-audit-web
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: ./verify
    image: rf-matrix-audit-verify
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./:/src:ro
    command: ["sh", "/src/verify/run.sh"]
